<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaving Parafield Studios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
        body { 
            background: var(--content-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .redirect-container {
            max-width: 600px;
            width: 90%;
            padding: 4rem 3rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            position: relative;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .warning-icon { 
            width: 80px; 
            margin-bottom: 2rem; 
            filter: invert(47%) sepia(61%) saturate(2517%) hue-rotate(0deg) brightness(92%) contrast(92%);
            animation: pulse-warn 2s ease-in-out infinite;
        }
        @keyframes pulse-warn {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .url-box {
            background: var(--content-bg);
            border: 1px dashed rgba(201,121,15,0.4);
            border-radius: 12px;
            padding: 1.2rem;
            font-size: 0.75rem;
            color: var(--primary-deep);
            word-break: break-all;
            margin: 2.5rem 0;
            text-align: left;
        }
        .btn-group { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .btn-back { color: var(--text-muted); border: 1.5px solid var(--border); background: transparent; }
        .btn-go { background: var(--primary); color: #fff; }
        .btn:hover { transform: translateY(-3px); }
        .btn-go:hover { background: var(--primary-deep); box-shadow: var(--shadow-hover); }
        .btn-back:hover { border-color: var(--text-muted); color: var(--text); }
        
        .funny-text { 
            margin-top: 3rem; 
            color: var(--text-muted); 
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <img src="assets/warning.svg" class="warning-icon" alt="Warning">
        <h1 style="font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 1rem; color: var(--text);">LEAVING<br><span style="color: var(--primary-deep);">PARAFIELD</span></h1>
        <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; max-width: 400px; margin: 0 auto;">You're about to visit an external website. Parafield Studios isn't responsible for what happens there.</p>
        
        <div id="url-display" class="url-box">Destination: Loading...</div>
        
        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-back">Go Back</a>
            <a href="#" id="continue-link" class="btn btn-go">Continue</a>
        </div>
        
        <p id="funny-text" class="funny-text"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let targetUrl = params.get('url');
        
        if (targetUrl) {
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }
            document.getElementById('url-display').textContent = `Destination: ${targetUrl}`;
            document.getElementById('continue-link').href = targetUrl;
        } else {
            document.getElementById('url-display').textContent = "No destination specified.";
            document.getElementById('continue-link').style.display = 'none';
        }

        const funnyTexts = [
            "Careful where you step.",
            "The internet is a scary place.",
            "Don't say we didn't warn you.",
            "Leaving the safety of the studio...",
            "Watch out for dragons.",
            "Tell them Parafield sent you.",
            "Remember to hydrate while you're out there.",
            "Wait, did you leave the oven on?",
            "NO! DON'T LEAVE ME HERE!",
            "MICHAEL DONT LEAVE ME HERE MICHAEL!!!",
            "You're entering the wild west of the web.",
            "Farewell, brave traveler."
        ];

        document.getElementById('funny-text').textContent = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
    </script>
</body>
</html>
